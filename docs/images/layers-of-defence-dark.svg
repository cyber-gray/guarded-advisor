<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" role="img" aria-label="Layers of defence around an AI agent"><title>Layers of defence around an AI agent</title><rect x="1" y="1" width="1238" height="438" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/><text x="40" y="54" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#E6EDF3" text-anchor="start">Layers of defence around an AI agent</text><text x="40" y="82" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9DA7B3" text-anchor="start">Each layer is designed to catch what the one before it misses.</text><rect x="19" y="116" width="104" height="140" rx="12" fill="#161B22" stroke="#6E7681" stroke-width="2" stroke-dasharray="6 5"/><text x="71.0" y="171.0" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9DA7B3" text-anchor="middle">Requests</text><text x="71.0" y="191.0" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9DA7B3" text-anchor="middle">and member</text><text x="71.0" y="211.0" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9DA7B3" text-anchor="middle">documents</text><path d="M130 186.0 l10 0" stroke="#6E7681" stroke-width="2"/><path d="M136 181.0 l6 5 l-6 5" fill="none" stroke="#6E7681" stroke-width="2"/><rect x="145" y="116" width="140" height="140" rx="12" fill="#7C3AED" fill-opacity="0.16" stroke="#7C3AED" stroke-width="2"/><path d="M145 156 V128 a12 12 0 0 1 12 -12 H273 a12 12 0 0 1 12 12 V156 Z" fill="#7C3AED"/><text x="215.0" y="142" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Identity</text><text x="215.0" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">Entra ID, PIM</text><text x="215.0" y="210" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">Managed identities</text><path d="M292 186.0 l10 0" stroke="#6E7681" stroke-width="2"/><path d="M298 181.0 l6 5 l-6 5" fill="none" stroke="#6E7681" stroke-width="2"/><rect x="307" y="116" width="140" height="140" rx="12" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="2"/><path d="M307 156 V128 a12 12 0 0 1 12 -12 H435 a12 12 0 0 1 12 12 V156 Z" fill="#2563EB"/><text x="377.0" y="142" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Network</text><text x="377.0" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">Private endpoints</text><text x="377.0" y="210" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">Bastion jumpbox</text><path d="M454 186.0 l10 0" stroke="#6E7681" stroke-width="2"/><path d="M460 181.0 l6 5 l-6 5" fill="none" stroke="#6E7681" stroke-width="2"/><rect x="469" y="116" width="140" height="140" rx="12" fill="#0F766E" fill-opacity="0.16" stroke="#0F766E" stroke-width="2"/><path d="M469 156 V128 a12 12 0 0 1 12 -12 H597 a12 12 0 0 1 12 12 V156 Z" fill="#0F766E"/><text x="539.0" y="142" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Content filters</text><text x="539.0" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">Prompt Shields</text><text x="539.0" y="210" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">APIM content safety</text><path d="M616 186.0 l10 0" stroke="#6E7681" stroke-width="2"/><path d="M622 181.0 l6 5 l-6 5" fill="none" stroke="#6E7681" stroke-width="2"/><rect x="631" y="116" width="140" height="140" rx="12" fill="#0F766E" fill-opacity="0.16" stroke="#0F766E" stroke-width="2"/><path d="M631 156 V128 a12 12 0 0 1 12 -12 H759 a12 12 0 0 1 12 12 V156 Z" fill="#0F766E"/><text x="701.0" y="142" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agent tools</text><text x="701.0" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">Access checked</text><text x="701.0" y="210" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">in code; read-only</text><path d="M778 186.0 l10 0" stroke="#6E7681" stroke-width="2"/><path d="M784 181.0 l6 5 l-6 5" fill="none" stroke="#6E7681" stroke-width="2"/><rect x="793" y="116" width="140" height="140" rx="12" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="2"/><path d="M793 156 V128 a12 12 0 0 1 12 -12 H921 a12 12 0 0 1 12 12 V156 Z" fill="#2563EB"/><text x="863.0" y="142" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sandbox</text><text x="863.0" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">Egress denied</text><text x="863.0" y="210" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">No secrets inside</text><path d="M940 186.0 l10 0" stroke="#6E7681" stroke-width="2"/><path d="M946 181.0 l6 5 l-6 5" fill="none" stroke="#6E7681" stroke-width="2"/><rect x="955" y="116" width="140" height="140" rx="12" fill="#B45309" fill-opacity="0.16" stroke="#B45309" stroke-width="2"/><path d="M955 156 V128 a12 12 0 0 1 12 -12 H1083 a12 12 0 0 1 12 12 V156 Z" fill="#B45309"/><text x="1025.0" y="142" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Human review</text><text x="1025.0" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">A person decides</text><text x="1025.0" y="210" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#E6EDF3" text-anchor="middle">AI draft label</text><path d="M1102 186.0 l10 0" stroke="#6E7681" stroke-width="2"/><path d="M1108 181.0 l6 5 l-6 5" fill="none" stroke="#6E7681" stroke-width="2"/><rect x="1117" y="116" width="104" height="140" rx="12" fill="#161B22" stroke="#6E7681" stroke-width="2" stroke-dasharray="6 5"/><text x="1169.0" y="171.0" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9DA7B3" text-anchor="middle">An AI draft,</text><text x="1169.0" y="191.0" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9DA7B3" text-anchor="middle">never a</text><text x="1169.0" y="211.0" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9DA7B3" text-anchor="middle">decision</text><rect x="145" y="286" width="950" height="60" rx="12" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="2"/><text x="620.0" y="311" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#60A5FA" text-anchor="middle">Detection and audit across every layer</text><text x="620.0" y="333" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E6EDF3" text-anchor="middle">Microsoft Sentinel, Defender for AI Services, Purview Audit, application logs</text><text x="145" y="396" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9DA7B3" text-anchor="start">Colour shows the lens:</text><rect x="313" y="384" width="14" height="14" rx="3" fill="#2563EB"/><text x="335" y="396" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="start">Cybersecurity</text><rect x="473" y="384" width="14" height="14" rx="3" fill="#7C3AED"/><text x="495" y="396" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="start">IAM</text><rect x="553" y="384" width="14" height="14" rx="3" fill="#B45309"/><text x="575" y="396" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="start">GRC</text><rect x="633" y="384" width="14" height="14" rx="3" fill="#0F766E"/><text x="655" y="396" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3" text-anchor="start">AI Security</text></svg>